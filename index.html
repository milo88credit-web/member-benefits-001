<!DOCTYPE html>
<html lang="zh-HK">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>會員專屬禮遇</title>

  <meta
    name="description"
    content="為新會員而設，開啟你的專屬會員禮遇。"
  >

  <meta property="og:type" content="website">
  <meta property="og:title" content="會員專屬禮遇">

  <meta
    property="og:description"
    content="為新會員而設，開啟你的專屬會員禮遇。"
  >


  <style>

    /* =========================
       RESET
    ========================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }


    /* =========================
       BODY
    ========================= */

    body {

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang TC",
        "Microsoft JhengHei",
        "Noto Sans TC",
        Arial,
        sans-serif;

      color: #ffffff;

      background:

        radial-gradient(
          circle at 50% -5%,
          rgba(133, 62, 255, 0.25) 0%,
          rgba(72, 27, 135, 0.10) 32%,
          transparent 58%
        ),

        radial-gradient(
          circle at 10% 85%,
          rgba(219, 68, 255, 0.07),
          transparent 35%
        ),

        linear-gradient(
          180deg,
          #10091d 0%,
          #090511 50%,
          #050308 100%
        );

      overflow-x: hidden;
    }


    /* =========================
       PAGE
    ========================= */

    .page {

      width: 100%;

      min-height: 100svh;

      display: flex;

      align-items: center;

      justify-content: center;

      padding:
        max(24px, env(safe-area-inset-top))
        14px
        max(24px, env(safe-area-inset-bottom));

    }


    /* =========================
       CARD
    ========================= */

    .card {

      position: relative;

      width: 100%;

      max-width: 390px;

      padding:
        54px
        27px
        40px;

      text-align: center;

      border-radius: 30px;

      border:
        1px solid
        rgba(180, 111, 255, 0.32);

      background:

        radial-gradient(
          circle at 50% 5%,
          rgba(144, 69, 255, 0.13),
          transparent 38%
        ),

        linear-gradient(
          180deg,
          rgba(25, 15, 44, 0.98) 0%,
          rgba(17, 10, 31, 0.99) 48%,
          rgba(10, 6, 19, 0.99) 100%
        );

      box-shadow:

        0 30px 90px
        rgba(0, 0, 0, 0.50),

        0 0 40px
        rgba(133, 62, 255, 0.06),

        inset 0 1px 0
        rgba(230, 207, 255, 0.06);

      overflow: hidden;

    }


    /* =========================
       TOP GLOW
    ========================= */

    .card::before {

      content: "";

      position: absolute;

      width: 370px;

      height: 290px;

      left: 50%;

      top: -185px;

      transform:
        translateX(-50%);

      background:

        radial-gradient(
          circle,
          rgba(164, 83, 255, 0.24),
          transparent 68%
        );

      pointer-events: none;

    }


    /* =========================
       新人豪禮
    ========================= */

    .offer-title {

      position: relative;

      z-index: 2;

      color: #faf7ff;

      font-size: 39px;

      line-height: 1.15;

      font-weight: 900;

      letter-spacing: 3px;

      text-shadow:

        0 3px 14px
        rgba(0, 0, 0, 0.38),

        0 0 18px
        rgba(182, 120, 255, 0.08);

    }


    /* =========================
       TOP LINE
    ========================= */

    .title-line {

      width: 64%;

      height: 1px;

      margin:
        20px
        auto
        25px;

      background:

        linear-gradient(
          90deg,
          transparent,
          rgba(193, 128, 255, 0.78),
          rgba(255, 116, 232, 0.72),
          transparent
        );

      box-shadow:

        0 0 10px
        rgba(186, 93, 255, 0.34);

    }


    /* =========================
       OFFER
    ========================= */

    .offer {

      position: relative;

      width: 100%;

    }


    /* =========================
       250%
    ========================= */

    .offer-number {

      position: relative;

      z-index: 2;

      display: inline-block;

      font-size:
        clamp(90px, 27vw, 116px);

      line-height: 0.92;

      font-weight: 900;

      letter-spacing: -6px;

      white-space: nowrap;

      background:

        linear-gradient(
          135deg,
          #f4eaff 0%,
          #c98cff 22%,
          #a75dff 47%,
          #ff79dc 72%,
          #8ddfff 100%
        );

      -webkit-background-clip: text;

      background-clip: text;

      -webkit-text-fill-color:
        transparent;

      filter:

        drop-shadow(
          0 4px 0
          rgba(48, 16, 78, 0.20)
        )

        drop-shadow(
          0 0 13px
          rgba(172, 82, 255, 0.30)
        )

        drop-shadow(
          0 0 25px
          rgba(231, 88, 255, 0.10)
        );

    }


    /* =========================
       NEON UNDERLINE
    ========================= */

    .offer::after {

      content: "";

      position: absolute;

      width: 88%;

      height: 1px;

      left: 6%;

      bottom: 0;

      background:

        linear-gradient(
          90deg,
          transparent,
          rgba(176, 91, 255, 0.85),
          rgba(255, 101, 222, 0.85),
          transparent
        );

      box-shadow:

        0 0 13px
        rgba(185, 83, 255, 0.48);

    }


    /* =========================
       SPARKS
    ========================= */

    .spark {

      position: absolute;

      z-index: 3;

      width: 5px;

      height: 5px;

      border-radius: 50%;

      background: #f3dcff;

      box-shadow:

        0 0 6px
        #d9a5ff,

        0 0 15px
        rgba(207, 103, 255, 0.85);

    }


    .spark.one {

      left: 7%;

      top: 4%;

    }


    .spark.two {

      right: 5%;

      bottom: 4%;

      background: #ffd5f6;

    }


    .spark.three {

      left: 50%;

      bottom: -2%;

      background: #b8ecff;

    }


    /* =========================
       SECOND LINE
    ========================= */

    .neon-divider {

      width: 55%;

      height: 1px;

      margin:
        27px
        auto
        0;

      background:

        linear-gradient(
          90deg,
          transparent,
          rgba(186, 99, 255, 0.42),
          rgba(255, 104, 221, 0.35),
          transparent
        );

    }


    /* =========================
       DESCRIPTION
    ========================= */

    .description {

      margin-top: 32px;

      color: #c4bbd0;

      font-size: 15px;

      line-height: 1.8;

      font-weight: 400;

      letter-spacing: 0.2px;

    }


    .description strong {

      color: #d59aff;

      font-weight: 800;

      text-shadow:

        0 0 10px
        rgba(192, 101, 255, 0.15);

    }


    /* =========================
       SMALL NEON DIVIDER
    ========================= */

    .divider {

      position: relative;

      width: 82px;

      height: 1px;

      margin:
        30px
        auto
        26px;

      background:

        linear-gradient(
          90deg,
          transparent,
          rgba(184, 105, 255, 0.28),
          transparent
        );

    }


    .divider::after {

      content: "";

      position: absolute;

      width: 29px;

      height: 3px;

      left: 50%;

      top: 50%;

      transform:
        translate(-50%, -50%);

      border-radius: 20px;

      background:

        linear-gradient(
          90deg,
          #9e5dff,
          #ee6edb
        );

      box-shadow:

        0 0 10px
        rgba(181, 82, 255, 0.75),

        0 0 20px
        rgba(236, 91, 220, 0.25);

    }


    /* =========================
       QUESTION
    ========================= */

    .question {

      margin-bottom: 22px;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 8px;

      color: #ffffff;

      font-size: 18px;

      line-height: 1.4;

      font-weight: 800;

      letter-spacing: 0.4px;

      white-space: nowrap;

    }


    /* =========================
       POINTER
    ========================= */

    .question-pointer {

      display: inline-block;

      font-size: 34px;

      line-height: 1;

      transform-origin: center;

      filter:

        drop-shadow(
          0 3px 4px
          rgba(0, 0, 0, 0.42)
        )

        drop-shadow(
          0 0 7px
          rgba(190, 101, 255, 0.22)
        );

      animation:
        pointDown
        1.3s
        ease-in-out
        infinite;

    }


    @keyframes pointDown {

      0%,
      100% {

        transform:
          translateY(0);

      }

      50% {

        transform:
          translateY(7px);

      }

    }


    /* =========================
       BUTTON GROUP
    ========================= */

    .buttons {

      display: flex;

      flex-direction: column;

      gap: 14px;

    }


    .cta {

      width: 100%;

      display: flex;

      align-items: center;

      justify-content: center;

      text-decoration: none;

      -webkit-tap-highlight-color:
        transparent;

      transition:

        transform 0.18s ease,

        box-shadow 0.18s ease,

        filter 0.18s ease;

    }


    .cta:active {

      transform:
        scale(0.985);

    }


    /* =========================
       MAIN CTA
    ========================= */

    .primary {

      min-height: 72px;

      gap: 14px;

      border-radius: 17px;

      color: #ffffff;

      font-size: 20px;

      font-weight: 900;

      background:

        linear-gradient(
          135deg,
          #b76cff 0%,
          #9251f4 30%,
          #d44bd5 67%,
          #ee6dc8 100%
        );

      border:

        1px solid
        rgba(232, 190, 255, 0.75);

      box-shadow:

        0 13px 32px
        rgba(151, 69, 241, 0.30),

        0 0 26px
        rgba(200, 74, 255, 0.19),

        inset 0 1px 0
        rgba(255, 255, 255, 0.36);

      text-shadow:

        0 1px 4px
        rgba(49, 10, 70, 0.40);

    }


    .primary:hover {

      filter:
        brightness(1.08);

      box-shadow:

        0 16px 38px
        rgba(151, 69, 241, 0.37),

        0 0 33px
        rgba(200, 74, 255, 0.24),

        inset 0 1px 0
        rgba(255, 255, 255, 0.40);

    }


    .arrow {

      font-size: 22px;

      line-height: 1;

    }


    /* =========================
       WHATSAPP
    ========================= */

    .whatsapp {

      min-height: 63px;

      gap: 10px;

      border-radius: 17px;

      color: #d29cff;

      font-size: 17px;

      font-weight: 800;

      border:

        1px solid
        rgba(177, 103, 255, 0.58);

      background:

        linear-gradient(
          180deg,
          rgba(34, 20, 57, 0.78),
          rgba(19, 11, 34, 0.90)
        );

      box-shadow:

        inset 0 1px 0
        rgba(229, 205, 255, 0.05),

        0 0 18px
        rgba(152, 71, 241, 0.05);

    }


    .whatsapp:hover {

      background:

        linear-gradient(
          180deg,
          rgba(48, 26, 77, 0.88),
          rgba(27, 14, 46, 0.96)
        );

    }


    /* =========================
       WHATSAPP ICON
    ========================= */

    .whatsapp-icon {

      width: 23px;

      height: 23px;

      display: inline-flex;

      align-items: center;

      justify-content: center;

    }


    .whatsapp-icon svg {

      width: 100%;

      height: 100%;

      fill: currentColor;

    }


    /* =========================
       SMALL MOBILE
    ========================= */

    @media (max-width: 360px) {

      .page {

        padding-left: 10px;

        padding-right: 10px;

      }


      .card {

        padding:
          49px
          21px
          34px;

      }


      .offer-title {

        font-size: 34px;

      }


      .offer-number {

        font-size: 84px;

      }


      .description {

        font-size: 14px;

      }


      .question {

        font-size: 16px;

        gap: 5px;

      }


      .question-pointer {

        font-size: 30px;

      }


      .primary {

        min-height: 67px;

        font-size: 18px;

      }


      .whatsapp {

        min-height: 59px;

        font-size: 16px;

      }

    }


    /* =========================
       DESKTOP
    ========================= */

    @media (min-width: 768px) {

      .card {

        max-width: 580px;

        padding:
          68px
          58px
          52px;

      }


      .offer-title {

        font-size: 53px;

      }


      .offer-number {

        font-size: 150px;

      }


      .description {

        font-size: 18px;

      }


      .question {

        font-size: 21px;

        gap: 10px;

      }


      .question-pointer {

        font-size: 38px;

      }


      .primary {

        min-height: 78px;

        font-size: 21px;

      }


      .whatsapp {

        min-height: 68px;

        font-size: 18px;

      }

    }


    /* =========================
       REDUCED MOTION
    ========================= */

    @media (prefers-reduced-motion: reduce) {

      .question-pointer {

        animation: none;

      }

    }

  </style>

</head>


<body>

  <main class="page">

    <section class="card">


      <!-- 新人豪禮 -->

      <h1 class="offer-title">

        新人豪禮

      </h1>


      <div class="title-line"></div>


      <!-- 250% -->

      <div class="offer">

        <span class="spark one"></span>

        <span class="spark two"></span>

        <span class="spark three"></span>


        <div class="offer-number">

          250%

        </div>

      </div>


      <div class="neon-divider"></div>


      <!-- DESCRIPTION -->

      <div class="description">

        <strong>

        </strong>

      </div>


      <!-- DIVIDER -->

      <div class="divider"></div>


      <!-- QUESTION -->

      <div class="question">

        <span>
          準備好加入了嗎？
        </span>

        <span
          class="question-pointer"
          aria-hidden="true"
        >
          👇
        </span>

      </div>


      <!-- BUTTONS -->

      <div class="buttons">


        <!-- MAIN CTA -->

        <a
          class="cta primary"
          href="https://96jqk.com/?ag=kfbads001"
          target="_blank"
          rel="noopener noreferrer"
        >

          <span>
            立即加入
          </span>

          <span class="arrow">
            →
          </span>

        </a>


        <!-- WHATSAPP SHORT LINK -->

        <a
          class="cta whatsapp"
          href="https://t.ly/bhZ8h"
          target="_blank"
          rel="noopener noreferrer"
        >

          <span class="whatsapp-icon">

            <svg
              viewBox="0 0 32 32"
              aria-hidden="true"
            >

              <path d="M16.01 3C8.83 3 3 8.67 3 15.65c0 2.46.73 4.86 2.1 6.91L3 29l6.65-2.06a13.18 13.18 0 0 0 6.36 1.64C23.18 28.58 29 22.92 29 15.65 29 8.67 23.18 3 16.01 3Zm0 23.45c-2.05 0-4.05-.54-5.79-1.57l-.42-.25-3.95 1.22 1.28-3.75-.27-.43a10.45 10.45 0 0 1-1.73-5.77c0-5.81 4.88-10.54 10.88-10.54 6 0 10.88 4.73 10.88 10.54 0 5.82-4.88 10.55-10.88 10.55Zm5.97-7.89c-.33-.16-1.94-.93-2.24-1.04-.3-.11-.52-.16-.74.16-.22.32-.85 1.04-1.04 1.25-.19.22-.38.24-.71.08-.33-.16-1.38-.49-2.63-1.57-.97-.84-1.63-1.88-1.82-2.2-.19-.32-.02-.49.14-.65.15-.14.33-.38.49-.57.16-.19.22-.32.33-.54.11-.22.05-.41-.03-.57-.08-.16-.74-1.73-1.01-2.37-.27-.64-.54-.55-.74-.56h-.63c-.22 0-.57.08-.88.41-.3.32-1.15 1.09-1.15 2.66 0 1.57 1.18 3.09 1.34 3.3.16.22 2.32 3.44 5.62 4.82.79.33 1.4.53 1.88.68.79.24 1.5.21 2.07.13.63-.09 1.94-.77 2.21-1.52.27-.75.27-1.39.19-1.52-.08-.14-.3-.22-.63-.38Z"/>

            </svg>

          </span>


          <span>

          </span>

        </a>


      </div>

    </section>

  </main>

</body>

</html>
