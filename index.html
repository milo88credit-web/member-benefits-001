  <style>

    /* =========================
       RESET
    ========================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }


    /* =========================
       BODY
    ========================= */

    body {

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang TC",
        "Microsoft JhengHei",
        "Noto Sans TC",
        Arial,
        sans-serif;

      color: #ffffff;

      background:

        radial-gradient(
          circle at 50% 0%,
          rgba(25, 128, 89, 0.24) 0%,
          rgba(4, 62, 45, 0.10) 32%,
          transparent 60%
        ),

        linear-gradient(
          180deg,
          #063d2f 0%,
          #02291f 48%,
          #001a14 100%
        );

      overflow-x: hidden;
    }


    /* =========================
       PAGE
    ========================= */

    .page {

      width: 100%;
      min-height: 100svh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding:
        max(24px, env(safe-area-inset-top))
        14px
        max(24px, env(safe-area-inset-bottom));
    }


    /* =========================
       CARD
    ========================= */

    .card {

      position: relative;

      width: 100%;
      max-width: 390px;

      padding:
        54px
        27px
        40px;

      text-align: center;

      border-radius: 30px;

      border:
        1px solid rgba(212, 175, 82, 0.36);

      background:

        radial-gradient(
          circle at 50% 6%,
          rgba(32, 145, 99, 0.17),
          transparent 38%
        ),

        linear-gradient(
          180deg,
          rgba(5, 70, 51, 0.98) 0%,
          rgba(2, 50, 37, 0.99) 48%,
          rgba(0, 35, 27, 0.99) 100%
        );

      box-shadow:
        0 30px 90px rgba(0, 0, 0, 0.42),
        inset 0 1px 0 rgba(255, 239, 178, 0.05);

      overflow: hidden;
    }


    /* =========================
       BACKGROUND GLOW
    ========================= */

    .card::before {

      content: "";

      position: absolute;

      width: 360px;
      height: 280px;

      left: 50%;
      top: -170px;

      transform: translateX(-50%);

      background:
        radial-gradient(
          circle,
          rgba(60, 195, 128, 0.18),
          transparent 68%
        );

      pointer-events: none;
    }


    /* =========================
       新人豪禮
    ========================= */

    .offer-title {

      position: relative;
      z-index: 2;

      color: #fffaf0;

      font-size: 39px;
      line-height: 1.15;

      font-weight: 900;

      letter-spacing: 3px;

      text-shadow:
        0 4px 15px rgba(0, 0, 0, 0.30);
    }


    /* =========================
       TOP GOLD LINE
    ========================= */

    .title-line {

      width: 64%;
      height: 1px;

      margin:
        20px
        auto
        25px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(239, 202, 105, 0.75),
          transparent
        );

      box-shadow:
        0 0 9px rgba(236, 192, 84, 0.22);
    }


    /* =========================
       OFFER
    ========================= */

    .offer {

      position: relative;

      width: 100%;
    }


    /* =========================
       250%
    ========================= */

    .offer-number {

      position: relative;
      z-index: 2;

      display: inline-block;

      font-size:
        clamp(90px, 27vw, 116px);

      line-height: 0.92;

      font-weight: 900;

      letter-spacing: -6px;

      white-space: nowrap;

      background:
        linear-gradient(
          180deg,
          #fff5bd 0%,
          #ffe17b 22%,
          #e9b83e 57%,
          #b77b18 100%
        );

      -webkit-background-clip: text;
      background-clip: text;

      -webkit-text-fill-color: transparent;

      filter:
        drop-shadow(
          0 4px 0 rgba(80, 50, 3, 0.12)
        )
        drop-shadow(
          0 0 17px rgba(255, 211, 93, 0.18)
        );
    }


    /* =========================
       GOLD UNDERLINE
    ========================= */

    .offer::after {

      content: "";

      position: absolute;

      width: 88%;
      height: 1px;

      left: 6%;
      bottom: 0;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255, 213, 98, 0.85),
          transparent
        );

      box-shadow:
        0 0 12px rgba(240, 192, 73, 0.35);
    }


    /* =========================
       SPARKLES
    ========================= */

    .spark {

      position: absolute;
      z-index: 3;

      width: 5px;
      height: 5px;

      border-radius: 50%;

      background: #fff3ae;

      box-shadow:
        0 0 6px #fff1a0,
        0 0 14px rgba(255, 215, 99, 0.8);
    }

    .spark.one {
      left: 7%;
      top: 4%;
    }

    .spark.two {
      right: 5%;
      bottom: 4%;
    }

    .spark.three {
      left: 50%;
      bottom: -2%;
    }


    /* =========================
       SECOND DIVIDER
    ========================= */

    .gold-divider {

      width: 55%;
      height: 1px;

      margin:
        27px
        auto
        0;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(218, 178, 75, 0.35),
          transparent
        );
    }


    /* =========================
       DESCRIPTION
    ========================= */

    .description {

      margin-top: 32px;

      color: #d4ddd8;

      font-size: 15px;
      line-height: 1.8;

      font-weight: 400;

      letter-spacing: 0.2px;
    }

    .description strong {

      color: #f0c85b;

      font-weight: 800;
    }


    /* =========================
       GREEN DIVIDER
    ========================= */

    .divider {

      position: relative;

      width: 82px;
      height: 1px;

      margin:
        30px
        auto
        26px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(94, 235, 173, 0.28),
          transparent
        );
    }

    .divider::after {

      content: "";

      position: absolute;

      width: 28px;
      height: 3px;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      border-radius: 20px;

      background: #72efbb;

      box-shadow:
        0 0 10px rgba(79, 238, 172, 0.62);
    }


    /* =========================
       QUESTION + HAND
    ========================= */

    .question {

      margin-bottom: 22px;

      display: flex;

      align-items: center;
      justify-content: center;

      gap: 8px;

      color: #ffffff;

      font-size: 18px;
      line-height: 1.4;

      font-weight: 800;

      letter-spacing: 0.4px;

      white-space: nowrap;
    }

    .question-pointer {

      display: inline-block;

      font-size: 34px;
      line-height: 1;

      transform-origin: center;

      filter:
        drop-shadow(
          0 3px 4px rgba(0, 0, 0, 0.38)
        );

      animation:
        pointDown 1.3s ease-in-out infinite;
    }


    @keyframes pointDown {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(7px);
      }
    }


    /* =========================
       BUTTON GROUP
    ========================= */

    .buttons {

      display: flex;

      flex-direction: column;

      gap: 14px;
    }


    .cta {

      width: 100%;

      display: flex;

      align-items: center;
      justify-content: center;

      text-decoration: none;

      -webkit-tap-highlight-color: transparent;

      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease,
        filter 0.18s ease;
    }


    .cta:active {
      transform: scale(0.985);
    }


    /* =========================
       MAIN CTA
    ========================= */

    .primary {

      min-height: 72px;

      gap: 14px;

      border-radius: 17px;

      color: #002c1f;

      font-size: 20px;

      font-weight: 900;

      background:
        linear-gradient(
          135deg,
          #9bffc4 0%,
          #5ef39a 30%,
          #31db73 64%,
          #19bd5b 100%
        );

      border:
        1px solid rgba(221, 255, 225, 0.82);

      box-shadow:
        0 13px 32px rgba(36, 222, 116, 0.25),
        0 0 25px rgba(72, 255, 146, 0.16),
        inset 0 1px 0 rgba(255, 255, 255, 0.55);
    }


    .primary:hover {

      filter: brightness(1.06);

      box-shadow:
        0 16px 38px rgba(36, 222, 116, 0.32),
        0 0 31px rgba(72, 255, 146, 0.20),
        inset 0 1px 0 rgba(255, 255, 255, 0.60);
    }


    .arrow {

      font-size: 22px;
      line-height: 1;
    }


    /* =========================
       WHATSAPP
    ========================= */

    .whatsapp {

      min-height: 63px;

      gap: 10px;

      border-radius: 17px;

      color: #67eda7;

      font-size: 17px;

      font-weight: 800;

      border:
        1px solid rgba(67, 224, 144, 0.62);

      background:
        linear-gradient(
          180deg,
          rgba(4, 62, 45, 0.75),
          rgba(1, 40, 30, 0.88)
        );

      box-shadow:
        inset 0 1px 0 rgba(182, 255, 217, 0.05);
    }


    .whatsapp:hover {

      background:
        linear-gradient(
          180deg,
          rgba(7, 77, 55, 0.84),
          rgba(2, 49, 36, 0.94)
        );
    }


    /* =========================
       WHATSAPP ICON
    ========================= */

    .whatsapp-icon {

      width: 23px;
      height: 23px;

      display: inline-flex;

      align-items: center;
      justify-content: center;
    }


    .whatsapp-icon svg {

      width: 100%;
      height: 100%;

      fill: currentColor;
    }


    /* =========================
       SMALL MOBILE
    ========================= */

    @media (max-width: 360px) {

      .page {

        padding-left: 10px;
        padding-right: 10px;
      }


      .card {

        padding:
          49px
          21px
          34px;
      }


      .offer-title {
        font-size: 34px;
      }


      .offer-number {
        font-size: 84px;
      }


      .description {
        font-size: 14px;
      }


      .question {

        font-size: 16px;

        gap: 5px;
      }


      .question-pointer {
        font-size: 30px;
      }


      .primary {

        min-height: 67px;

        font-size: 18px;
      }


      .whatsapp {

        min-height: 59px;

        font-size: 16px;
      }
    }


    /* =========================
       DESKTOP
    ========================= */

    @media (min-width: 768px) {

      .card {

        max-width: 580px;

        padding:
          68px
          58px
          52px;
      }


      .offer-title {
        font-size: 53px;
      }


      .offer-number {
        font-size: 150px;
      }


      .description {
        font-size: 18px;
      }


      .question {

        font-size: 21px;

        gap: 10px;
      }


      .question-pointer {
        font-size: 38px;
      }


      .primary {

        min-height: 78px;

        font-size: 21px;
      }


      .whatsapp {

        min-height: 68px;

        font-size: 18px;
      }
    }


    /* =========================
       ACCESSIBILITY
    ========================= */

    @media (prefers-reduced-motion: reduce) {

      .question-pointer {
        animation: none;
      }
    }

  </style>
